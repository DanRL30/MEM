# Prepara el intérprete y el workspace uv.
# Se usa en todos los pipelines que tocan código Python.

# El valor por defecto instala los miembros del workspace y el grupo `dev`,
# que es lo que necesitan las pruebas. Un pipeline que corra bandit o pip-audit
# tiene que pedir además el grupo `security`, que no se instala solo:
#   instalarGrupos: "--all-packages --group security"
parameters:
  - name: instalarGrupos
    type: string
    default: "--all-packages"

steps:
  - task: UsePythonVersion@0
    displayName: "Python 3.12"
    inputs:
      versionSpec: "3.12"
      addToPath: true

  - script: |
      set -euo pipefail
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: "Instalar uv"

  - task: Cache@2
    displayName: "Caché de uv"
    inputs:
      key: 'uv | "$(Agent.OS)" | uv.lock | pyproject.toml'
      restoreKeys: |
        uv | "$(Agent.OS)"
      path: $(HOME)/.cache/uv

  - script: uv sync ${{ parameters.instalarGrupos }} --frozen
    displayName: "uv sync"
    workingDirectory: $(Build.SourcesDirectory)
