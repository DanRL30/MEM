# Raíz virtual del workspace uv — no es un paquete distribuible.
# Los miembros publicables están en packages/ y la aplicación en apps/api.

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/engine",
    "packages/ingest",
    "packages/domain",
    "packages/risk",
    "packages/reporting",
]

# Los paquetes internos se resuelven desde el workspace, nunca desde PyPI.
[tool.uv.sources]
minsur-engine = { workspace = true }
minsur-domain = { workspace = true }
minsur-ingest = { workspace = true }
minsur-risk = { workspace = true }
minsur-reporting = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # El TestClient de FastAPI delega en starlette.testclient, que desde
    # starlette 1.6 exige httpx2. Sin el, apps/api/tests/test_contrato.py
    # falla en la coleccion y arrastra a toda la suite.
    "httpx2>=2.12",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-openpyxl>=3.1",
    "pandas-stubs>=2.2",
]
security = [
    "bandit>=1.7",
    "pip-audit>=2.7",
]

# ---------------------------------------------------------------------------
# Pruebas
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps/api/tests", "tests/fidelidad"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "tenant_minsur: requiere datos reales de MINSUR; solo corre dentro del tenant del cliente",
    "fidelidad: contraste contra el modelo de referencia (N0-N3)",
    "lento: simulación de Montecarlo u otras corridas largas",
]

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Estilo y tipos
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "packages/*/src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit
    "PD",       # pandas-vet
    "NPY",      # numpy
    "RUF",
]
ignore = [
    "E501",     # la longitud la gobierna el formateador
    # N818 exige que una excepcion termine en Error. Los nombres del dominio
    # son sustantivos en espanol, donde el calificador va detras:
    # TransicionInvalida, PerfilNoAutorizado, ErrorVersionado. Cumplir la regla
    # obliga a TransicionInvalidaError, que no es ni ingles ni espanol.
    "N818",
]

# Sin esto, isort aisla cada import con `as` en una sentencia propia y el mismo
# modulo aparece dos veces seguidas. El alias existe para desambiguar dos
# Accion que conviven en el mismo archivo, y separarlo oscurece justamente eso.
[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert es el mecanismo de pytest
"tests/**" = ["S101"]

# FastAPI declara las dependencias y los parametros en los valores por defecto:
# esa llamada es la forma de declararlos, no una evaluacion accidental en la
# definicion. `requiere` es la fabrica propia que devuelve la dependencia de
# autorizacion y se usa siempre dentro de Depends.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "minsur_api.seguridad.requiere",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["packages/engine/src", "packages/domain/src", "packages/ingest/src", "packages/risk/src", "packages/reporting/src", "apps/api/src"]

# El motor es el núcleo del contraste de fidelidad: no admite tipos implícitos.
[[tool.mypy.overrides]]
module = "minsur_engine.*"
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["numpy_financial.*", "reportlab.*"]
ignore_missing_imports = true
