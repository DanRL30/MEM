[project]
name = "minsur-domain"
version = "0.1.0"
description = "Casos, corridas, versionado en tres ejes, maquina de estados, congelamiento y auditoria."
requires-python = ">=3.12,<3.13"
dependencies = [
    "minsur-engine",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "azure-storage-blob>=12.24",
    "azure-core>=1.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minsur_domain"]
