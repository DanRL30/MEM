[project]
name = "minsur-ingest"
version = "0.1.0"
description = "Lector y validador de las plantillas de Produccion, CAPEX y OPEX."
requires-python = ">=3.12,<3.13"
dependencies = [
    "minsur-domain",
    "minsur-engine",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minsur_ingest"]
