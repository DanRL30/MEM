[project]
name = "minsur-reporting"
version = "0.1.0"
description = "Exportacion del tablero y de los estados financieros a Excel y PDF."
requires-python = ">=3.12,<3.13"
dependencies = [
    "minsur-domain",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minsur_reporting"]
