[project]
name = "minsur-api"
version = "0.1.0"
description = "Servicios de aplicacion de la plataforma. Se publica detras de Azure API Management."
requires-python = ">=3.12,<3.13"
dependencies = [
    "minsur-domain",
    "minsur-ingest",
    "minsur-risk",
    "minsur-reporting",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-storage-blob>=12.24",
    "azure-data-tables>=12.5",
    "pyodbc>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minsur_api"]
